[project]
name = "dihari"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn[standard]", "sqlalchemy>=2", "pydantic>=2", "pydantic-settings", "httpx", "fastmcp", "psycopg2-binary", "python-multipart", "tzdata"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.optional-dependencies]
push = ["pywebpush>=2"]

[tool.setuptools.packages.find]
include = ["app*", "sim*", "adversarial*"]
