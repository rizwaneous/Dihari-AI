services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: dihari
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dihari}
      POSTGRES_DB: dihari
    volumes: ["dbdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dihari"]
      interval: 3s
      retries: 20
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: ["${DIHARI_ENV_FILE:-.env.example}"]
    environment:
      DATABASE_URL: postgresql+psycopg2://dihari:${POSTGRES_PASSWORD:-dihari}@db:5432/dihari
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
  web:
    build: { context: ., dockerfile: frontend/Dockerfile }
    depends_on: [backend]
    ports: ["8080:80"]
volumes:
  dbdata:
